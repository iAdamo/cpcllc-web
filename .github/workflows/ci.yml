name: CI

on:
  pull_request:
  push:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Informational only: the repo has pre-existing gluestack type noise and
      # `next build` ignores TS/lint, so tsc must not block merges (yet).
      - name: Typecheck (non-blocking)
        run: npx tsc --noEmit || true
      - run: npm test
      - run: npm run build

  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cpc-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
